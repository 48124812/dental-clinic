apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: dental-lab-gateway}
  template:
    metadata:
      labels: {app: dental-lab-gateway}
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 64Mi}
      volumes:
        - name: config
          configMap:
            name: lab-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: lab-gateway
spec:
  selector: {app: dental-lab-gateway}
  ports:
    - port: 8080
      targetPort: 8080
