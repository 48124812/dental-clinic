# Local port-forward gateway only; do not expose publicly without TLS/auth review.
server {
    listen 8080;
    server_name _;
    access_log off;
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
