apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dental-clinic
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: dental-clinic-api
        metrics_path: /metrics
        static_configs:
          - targets: ['api.dental-clinic.svc.cluster.local:3001']
