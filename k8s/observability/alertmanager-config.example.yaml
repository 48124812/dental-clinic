apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: dental-clinic
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      smtp_smarthost: "smtp.example.com:587"
      smtp_from: "alerts@example.com"
      smtp_auth_username: "alerts@example.com"
      smtp_auth_password: "REPLACE_WITH_SMTP_PASSWORD"
    route:
      receiver: clinic-admin-email
      group_by: [alertname]
      group_wait: 30s
      repeat_interval: 4h
    receivers:
      - name: clinic-admin-email
        email_configs:
          - to: "admin@example.com"
            send_resolved: true
