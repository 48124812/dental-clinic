apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: dental-clinic
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      smtp_smarthost: "smtp.resend.com:587"
      smtp_from: "onboarding@resend.dev"
      smtp_auth_username: "resend"
      smtp_auth_password: "REPLACE_WITH_RESEND_API_KEY"
    route:
      receiver: clinic-admin-email
      group_by: [alertname]
      group_wait: 30s
      repeat_interval: 4h
    receivers:
      - name: clinic-admin-email
        email_configs:
          - to: "REPLACE_WITH_YOUR_RESEND_VERIFIED_EMAIL"
            send_resolved: true
