apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: dental-clinic
data:
  dental-clinic-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "title": "API request rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(dental_clinic_http_requests_total{job=\"dental-clinic-api\",route!~\"/health|/ready|/metrics\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "title": "API 5xx error ratio",
          "type": "timeseries",
          "targets": [
            {
              "expr": "(sum(rate(dental_clinic_http_requests_total{job=\"dental-clinic-api\",route!~\"/health|/ready|/metrics\",status_code=~\"5..\"}[5m])) or vector(0)) / sum(rate(dental_clinic_http_requests_total{job=\"dental-clinic-api\",route!~\"/health|/ready|/metrics\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "title": "API p95 request latency",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(dental_clinic_http_request_duration_seconds_bucket{job=\"dental-clinic-api\",route!~\"/health|/ready|/metrics\"}[5m])))",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "id": 4,
          "title": "API process CPU usage (fraction of one core)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(dental_clinic_process_cpu_seconds_total{job=\"dental-clinic-api\"}[5m])",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "id": 5,
          "title": "API process resident memory",
          "type": "timeseries",
          "targets": [
            {
              "expr": "dental_clinic_process_resident_memory_bytes{job=\"dental-clinic-api\"}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 41,
      "title": "Dental Clinic API Overview",
      "version": 1
    }
