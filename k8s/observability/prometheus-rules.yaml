apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: dental-clinic
data:
  api-alerts.yml: |
    groups:
      - name: dental-clinic-api
        rules:
          - alert: DentalClinicApiDown
            expr: up{job="dental-clinic-api"} == 0 or absent(up{job="dental-clinic-api"})
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Dental Clinic API metrics target is unavailable
              description: Prometheus has been unable to scrape the API for 2 minutes.
          - alert: DentalClinicHighServerErrorRate
            expr: |
              (
                (sum(rate(dental_clinic_http_requests_total{job="dental-clinic-api",route!~"/health|/ready|/metrics",status_code=~"5.."}[5m])) or vector(0))
                /
                sum(rate(dental_clinic_http_requests_total{job="dental-clinic-api",route!~"/health|/ready|/metrics"}[5m]))
              ) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Dental Clinic API 5xx error rate exceeds 5%
              description: Investigate API logs, dependency health, and recent deployments.
