apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dental-clinic
resources:
  - ../base
  - api-hpa.yaml
patches:
  # Once enabled, HPA owns API replicas; subsequent applies must not reset to 2.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |-
      - op: remove
        path: /spec/replicas
