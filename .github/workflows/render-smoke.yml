name: Render smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    name: Verify deployed API
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_URL: ${{ vars.RENDER_API_URL }}
    steps:
      - name: Require deployment URL
        run: |
          test -n "$API_URL" || {
            echo 'Set the repository variable RENDER_API_URL before running this workflow.'
            exit 1
          }
      - name: Wait for API health check
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 "$API_URL/health"; then
              exit 0
            fi
            echo "Attempt $attempt/12 failed; retrying in 20 seconds..."
            sleep 20
          done
          exit 1
      - name: Verify public catalog data
        run: |
          doctors=$(curl --fail --silent --show-error "$API_URL/api/doctors")
          services=$(curl --fail --silent --show-error "$API_URL/api/services")
          test "$(echo "$doctors" | jq 'length')" -gt 0
          test "$(echo "$services" | jq 'length')" -gt 0
          echo "Smoke test passed: $(echo "$doctors" | jq 'length') doctors, $(echo "$services" | jq 'length') services."
