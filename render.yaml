# Web/API URLs remain stable when the manually managed demo database changes.
# Create PostgreSQL separately; do not recreate an expired DB on Blueprint sync.

services:
  - type: web
    name: dental-clinic-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    # Keep this a single executable command. Render's Docker-command parser
    # does not reliably handle shell operators such as `&&` here.
    dockerCommand: sh ./start-container.sh
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: APP_VERSION
        value: render
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SAMPLE_SEED
        value: "false"
      - key: CORS_ORIGIN
        fromService:
          name: dental-clinic-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: dental-clinic-web
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: apps/web/Dockerfile
    dockerCommand: node server.js
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: dental-clinic-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: INTERNAL_API_URL
        fromService:
          name: dental-clinic-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: "10000"
